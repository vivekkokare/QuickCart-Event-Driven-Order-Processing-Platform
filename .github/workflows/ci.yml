name: CI / CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ── Job 1: Test ─────────────────────────────────────────────────────────
  # Runs on every push and PR. Two matrix legs in parallel: one per service.
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ order-service, inventory-service ]
      fail-fast: false

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: order_admin
          POSTGRES_PASSWORD: order_admin_pw
          POSTGRES_DB: order_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: order_admin
          RABBITMQ_DEFAULT_PASS: order_admin_pw
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create inventory_system database
        if: matrix.service == 'inventory-service'
        run: |
          PGPASSWORD=order_admin_pw psql -h localhost -U order_admin -d order_system \
            -c "CREATE DATABASE inventory_system OWNER order_admin;"

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw -q clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  # ── Job 2: Deploy ────────────────────────────────────────────────────────
  # Runs only on pushes to master (not on PRs) and only after all tests pass.
  # Builds Docker images, pushes to ECR, and triggers a new ECS deployment.
  deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on merge to master, never on PRs
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    strategy:
      matrix:
        include:
          - service: order-service
            ecr_repo: quickcart/order-service
            ecs_service: order-service
            port: 8081
          - service: inventory-service
            ecr_repo: quickcart/inventory-service
            ecs_service: inventory-service
            port: 8082
      fail-fast: false

    permissions:
      id-token: write  # required for OIDC authentication with AWS
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC-based auth: GitHub requests a short-lived token from AWS instead
      # of storing long-lived access keys as secrets. No key rotation needed,
      # no risk of key leakage. This is the modern production approach.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build the JAR first (skipping tests — already ran in the test job)
      - name: Build JAR
        working-directory: ${{ matrix.service }}
        run: ./mvnw -q package -DskipTests -B

      # Tag with both the git SHA (immutable, for rollback) and 'latest'
      # (mutable, for ECS to always pull the newest image on deploy).
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.ecr_repo }}:$IMAGE_TAG \
                       -t $ECR_REGISTRY/${{ matrix.ecr_repo }}:latest \
                       ${{ matrix.service }}
          docker push $ECR_REGISTRY/${{ matrix.ecr_repo }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ matrix.ecr_repo }}:latest

      # Force a new ECS deployment so Fargate pulls the new 'latest' image.
      # ECS rolling update: it starts new tasks first, waits for them to
      # pass health checks, then stops the old tasks — zero-downtime deploy.
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster quickcart \
            --service ${{ matrix.ecs_service }} \
            --desired-count 1 \
            --force-new-deployment \
            --region eu-west-2
