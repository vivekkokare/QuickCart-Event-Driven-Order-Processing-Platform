spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/order_system
    username: order_admin
    password: order_admin_pw

  jpa:
    hibernate:
      # 'update' is fine for this local-dev learning phase only. Before any
      # shared/deployed environment, this must become 'validate' with schema
      # changes managed by versioned Flyway migrations instead — relying on
      # Hibernate auto-DDL in production is a well-known source of incidents.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: order_admin
    password: order_admin_pw

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
